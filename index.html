/* ============================================================

   ============================================================ */
const LS_KEY = 'mfmcf_acts_quiz_v1';
function loadState(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; }
}
function saveState(s){
  localStorage.setItem(LS_KEY, JSON.stringify(s));
}
let state = loadState();

/* ============================================================
   HELPERS
   ============================================================ */
function now(){ return new Date(); }
function fmtClock(ms){
  const total = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(total/60).toString().padStart(2,'0');
  const s = (total%60).toString().padStart(2,'0');
  return m+':'+s;
}
function normalize(str){
  return (str||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function textScore(answer, correct){
  const a = normalize(answer);
  const c = normalize(correct);
  if(!a) return false;
  if(a === c) return true;
  const cWords = c.split(' ').filter(w=>w.length>3);
  const aSet = new Set(a.split(' '));
  let hits = 0;
  cWords.forEach(w=>{ if(aSet.has(w)) hits++; });
  return cWords.length>0 && (hits/cWords.length) >= 0.6;
}
function computeScore(){
  let score = 0;
  QUESTIONS.forEach(q=>{
    const ans = (state.answers||{})[q.id];
    if(!ans) return;
    if(q.type==='mcq'){ if(ans===q.correct) score++; }
    else { if(textScore(ans, q.correct)) score++; }
  });
  return score;
}

/* ============================================================
   APP PHASE DETECTION
   ============================================================ */
function getPhase(){
  const t = now();
  if(state.submitted){
    return t >= CONFIG.RESULTS_TIME ? 'results' : 'waiting';
  }
  if(t < CONFIG.QUIZ_WINDOW_START) return 'countdown';
  if(t >= CONFIG.RESULTS_TIME) return 'missed_results';
  if(state.quizStartTime){
    const elapsed = t - new Date(state.quizStartTime);
    if(elapsed >= CONFIG.QUIZ_DURATION_SEC*1000){
      submitQuiz(true);
      return 'waiting';
    }
    return 'quiz';
  }
  if(state.registered) return 'ready';
  return 'register';
}

/* ============================================================
   RENDER ROOT
   ============================================================ */
const app = document.getElementById('app');
let tickHandle = null;
let toastTimeout = null;

function render(){
  if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  const phase = getPhase();
  app.innerHTML = '';
  app.appendChild(header());
  let body;
  switch(phase){
    case 'countdown': body = screenCountdown(); break;
    case 'register': body = screenRegister(); break;
    case 'ready': body = screenReady(); break;
    case 'quiz': body = screenQuiz(); break;
    case 'waiting': body = screenWaiting(); break;
    case 'results': body = screenResults(); break;
    case 'missed_results': body = screenResults(); break;
    default: body = screenRegister();
  }
  app.appendChild(body);
  app.appendChild(footer());
}

  return f;
}

function card(innerHTML, extraClass){
  const c = document.createElement('div');
  c.className = 'glass rounded-3xl w-full max-w-2xl p-6 md:p-10 fade-in ' + (extraClass||'');
  c.innerHTML = innerHTML;
  return c;
}

/* ============================================================
   SCREEN: COUNTDOWN
   ============================================================ */
function screenCountdown(){
  const c = card(`
    <div class="text-center">
      <div class="mx-auto w-16 h-16 rounded-2xl flex items-center justify-center mb-5" style="background:linear-gradient(135deg, rgba(246,201,118,0.18), rgba(255,122,61,0.10)); border:1px solid rgba(246,201,118,0.25);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8" stroke="#F6C976" stroke-width="1.6"/><path d="M12 9v4l3 2" stroke="#F6C976" stroke-width="1.6" stroke-linecap="round"/><path d="M9 2h6M12 2v2" stroke="#F6C976" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <h2 class="font-display text-xl md:text-2xl mb-2">The quiz opens soon</h2>
      <p class="text-sm text-[var(--ink-dim)] mb-8">Access unlocks ${CONFIG.EVENT_LABEL} at 8:00&nbsp;PM. Come back then to register and begin.</p>
      <div id="cd-grid" class="grid grid-cols-4 gap-3 max-w-md mx-auto"></div>
    </div>
  `);
  const grid = c.querySelector('#cd-grid');
  function draw(){
    const diff = CONFIG.QUIZ_WINDOW_START - now();
    if(diff <= 0){ render(); return; }
    const d = Math.floor(diff/86400000);
    const h = Math.floor((diff%86400000)/3600000);
    const m = Math.floor((diff%3600000)/60000);
    const s = Math.floor((diff%60000)/1000);
    grid.innerHTML = [[d,'Days'],[h,'Hrs'],[m,'Min'],[s,'Sec']].map(([v,l])=>`
      <div class="rounded-2xl py-4 px-2" style="background:rgba(255,255,255,0.03); border:1px solid rgba(246,201,118,0.12);">
        <div class="font-display text-2xl md:text-3xl gold-text">${String(v).padStart(2,'0')}</div>
        <div class="text-[10px] uppercase tracking-widest text-[var(--ink-faint)] mt-1">${l}</div>
      </div>`).join('');
  }
  draw();
  tickHandle = setInterval(draw, 1000);
  return c;
}

/* ============================================================
   SCREEN: REGISTER
   ============================================================ */
function screenRegister(){
  const c = card(`
    <h2 class="font-display text-xl md:text-2xl mb-1">Register to begin</h2>
    <p class="text-sm text-[var(--ink-dim)] mb-6">Fill in your details accurately — this record will appear on the leaderboard.</p>
    <form id="reg-form" class="space-y-4">
      <div>
        <label class="block text-xs uppercase tracking-wider text-[var(--ink-faint)] mb-1.5">Full Name</label>
        <input required name="name" type="text" placeholder="e.g. John Adebayo" class="w-full rounded-xl px-4 py-3 bg-white/5 border border-white/10 focus:border-[var(--gold-1)] outline-none text-sm placeholder:text-[var(--ink-faint)]">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-[var(--ink-faint)] mb-1.5">Email Address</label>
        <input required name="email" type="email" placeholder="you@example.com" class="w-full rounded-xl px-4 py-3 bg-white/5 border border-white/10 focus:border-[var(--gold-1)] outline-none text-sm placeholder:text-[var(--ink-faint)]">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-[var(--ink-faint)] mb-1.5">Phone Number / Department</label>
        <input required name="phone" type="text" placeholder="e.g. 08012345678 / Microbiology" class="w-full rounded-xl px-4 py-3 bg-white/5 border border-white/10 focus:border-[var(--gold-1)] outline-none text-sm placeholder:text-[var(--ink-faint)]">
      </div>

      <div class="rounded-2xl p-4 mt-2" style="background:rgba(230,80,58,0.08); border:1px solid rgba(230,80,58,0.25);">
        <p class="text-[13px] leading-relaxed text-[var(--ink-dim)]">
          <span class="font-semibold text-[var(--ink)]">Before you begin:</span> this is a timed, single-attempt assessment — 50 questions, 25 minutes. Switching tabs or minimizing this window will be logged as a warning; 3 warnings trigger automatic submission. Right-click and text copying are disabled. Please stay on this screen for the full duration.
        </p>
      </div>

      <button type="submit" class="gold-btn w-full rounded-xl py-3.5 pill text-sm mt-2">Start Quiz</button>
    </form>
  `);
  c.querySelector('#reg-form').addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    state.registered = true;
    state.user = { name: fd.get('name').trim(), email: fd.get('email').trim(), phone: fd.get('phone').trim() };
    state.warnings = 0;
    state.answers = {};
    saveState(state);
    render();
  });
  return c;
}

/* ============================================================
   SCREEN: READY (post-register, pre-start)
   ============================================================ */
function screenReady(){
  const c = card(`
    <div class="text-center">
      <div class="checkmark-circle mx-auto mb-5">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#6FBF8B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2 class="font-display text-xl md:text-2xl mb-2">Welcome, ${escapeHtml(state.user.name.split(' ')[0]||state.user.name)}</h2>
      <p class="text-sm text-[var(--ink-dim)] mb-8">You're registered. When you click below, the 25-minute timer starts immediately and cannot be paused.</p>
      <button id="begin-btn" class="gold-btn rounded-xl py-3.5 px-10 pill text-sm">Begin the 25-Minute Timer</button>
    </div>
  `);
  c.querySelector('#begin-btn').addEventListener('click', ()=>{
    state.quizStartTime = now().toISOString();
    state.currentQ = 0;
    saveState(state);
    render();
  });
  return c;
}

/* ============================================================
   SCREEN: QUIZ
   ============================================================ */
function screenQuiz(){
  if(state.currentQ === undefined) state.currentQ = 0;
  const idx = state.currentQ;
  const q = QUESTIONS[idx];
  const wrap = document.createElement('div');
  wrap.className = 'w-full max-w-2xl fade-in';

  // Sticky timer header
  const timerBar = document.createElement('div');
  timerBar.id = 'timer-bar';
  timerBar.className = 'sticky top-2 z-20 glass rounded-2xl px-4 py-3 mb-4 flex items-center justify-between';
  wrap.appendChild(timerBar);

  const qCard = document.createElement('div');
  qCard.className = 'glass rounded-3xl p-6 md:p-8';
  wrap.appendChild(qCard);

  function renderQuestion(){
    const q = QUESTIONS[state.currentQ];
    const savedAns = (state.answers||{})[q.id] || '';
    const pct = Math.round(((state.currentQ)/QUESTIONS.length)*100);
    qCard.innerHTML = `
      <div class="mb-5">
        <div class="flex items-center justify-between text-[11px] text-[var(--ink-faint)] mb-2 uppercase tracking-wider">
          <span>Question ${state.currentQ+1} of ${QUESTIONS.length}</span>
          <span>${pct}% complete</span>
        </div>
        <div class="progress-track h-1.5 rounded-full overflow-hidden">
          <div class="progress-fill h-full rounded-full" style="width:${pct}%"></div>
        </div>
      </div>
      <h3 class="font-display text-lg md:text-xl leading-snug mb-6">${escapeHtml(q.q)}</h3>
      <div id="answer-zone" class="space-y-3"></div>
      <div class="flex items-center gap-3 mt-8">
        <button id="prev-btn" class="ghost-btn rounded-xl py-3 px-5 pill text-sm flex-1" ${state.currentQ===0?'disabled':''}>Previous</button>
        ${state.currentQ === QUESTIONS.length-1
          ? `<button id="submit-btn" class="gold-btn rounded-xl py-3 px-5 pill text-sm flex-[2]">Submit Quiz</button>`
          : `<button id="next-btn" class="gold-btn rounded-xl py-3 px-5 pill text-sm flex-[2]">Next</button>`
        }
      </div>
    `;
    const zone = qCard.querySelector('#answer-zone');
    if(q.type === 'mcq'){
      q.options.forEach(opt=>{
        const row = document.createElement('div');
        row.className = 'radio-card rounded-xl px-4 py-3.5 flex items-center gap-3' + (savedAns===opt ? ' selected':'');
        row.innerHTML = `<div class="radio-dot"><div class="radio-dot-inner"></div></div><span class="text-sm leading-snug">${escapeHtml(opt)}</span>`;
        row.addEventListener('click', ()=>{
          state.answers[q.id] = opt;
          saveState(state);
          zone.querySelectorAll('.radio-card').forEach(r=>r.classList.remove('selected'));
          row.classList.add('selected');
        });
        zone.appendChild(row);
      });
    } else {
      zone.innerHTML = `<textarea id="text-ans" rows="4" placeholder="Type the scripture as accurately as you can recall it…" class="w-full rounded-xl px-4 py-3 bg-white/5 border border-white/10 focus:border-[var(--gold-1)] outline-none text-sm placeholder:text-[var(--ink-faint)] resize-none">${escapeHtml(savedAns)}</textarea>`;
      const ta = zone.querySelector('#text-ans');
      ta.addEventListener('input', ()=>{ state.answers[q.id] = ta.value; saveState(state); });
    }
    qCard.querySelector('#prev-btn').addEventListener('click', ()=>{
      if(state.currentQ>0){ state.currentQ--; saveState(state); renderQuestion(); window.scrollTo({top:0,behavior:'smooth'}); }
    });
    const nextBtn = qCard.querySelector('#next-btn');
    if(nextBtn) nextBtn.addEventListener('click', ()=>{
      state.currentQ++; saveState(state); renderQuestion(); window.scrollTo({top:0,behavior:'smooth'});
    });
    const submitBtn = qCard.querySelector('#submit-btn');
    if(submitBtn) submitBtn.addEventListener('click', ()=>{ submitQuiz(false); });
  }
  renderQuestion();

  function renderTimer(){
    const startT = new Date(state.quizStartTime);
    const elapsed = now() - startT;
    const remaining = CONFIG.QUIZ_DURATION_SEC*1000 - elapsed;
    if(remaining <= 0){ submitQuiz(true); return; }
    const secsLeft = remaining/1000;
    let colorClass = 'text-[var(--ok)]';
    let barBg = 'background:rgba(111,191,139,0.14); border-color:rgba(111,191,139,0.3);';
    if(secsLeft < 180){ colorClass='text-[var(--danger)]'; }
    else if(secsLeft < 600){ colorClass='text-[var(--gold-1)]'; barBg='background:rgba(246,201,118,0.12); border-color:rgba(246,201,118,0.3);'; }
    timerBar.style.cssText = barBg;
    timerBar.classList.toggle('pulse-red', secsLeft < 180);
    timerBar.innerHTML = `
      <div class="flex items-center gap-2 text-xs text-[var(--ink-dim)]">
        <div class="flame-wrap" style="width:22px;height:22px;"><div class="flame" style="animation-duration:${secsLeft<180?'0.6s':'1.6s'}"></div></div>
        Warnings: <span class="font-semibold ${state.warnings>0?'text-[var(--danger)]':'text-[var(--ink)]'}">${state.warnings||0}/${CONFIG.MAX_WARNINGS}</span>
      </div>
      <div class="font-display text-xl md:text-2xl font-semibold ${colorClass}">${fmtClock(remaining)}</div>
    `;
  }
  renderTimer();
  tickHandle = setInterval(renderTimer, 1000);

  return wrap;
}

function submitQuiz(auto){
  if(state.submitted) return;
  state.submitted = true;
  state.submittedAt = now().toISOString();
  state.autoSubmitted = !!auto;
  state.score = computeScore();
  saveState(state);
  render();
}

/* ============================================================
   SCREEN: WAITING
   ============================================================ */
function screenWaiting(){
  const flagged = state.flagged ? `<div class="mt-4 text-[11px] text-[var(--danger)] uppercase tracking-wider">This submission was flagged for review</div>` : '';
  const c = card(`
    <div class="text-center">
      <div class="checkmark-circle mx-auto mb-5">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#6FBF8B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2 class="font-display text-xl md:text-2xl mb-2">Submission received!</h2>
      <p class="text-sm text-[var(--ink-dim)] leading-relaxed">Your submission has been securely recorded. Official results and the leaderboard will be released on this page at exactly <span class="text-[var(--ink)] font-semibold">9:00 PM</span>.</p>
      ${flagged}
      <div id="wait-cd" class="mt-8 flex items-center justify-center gap-2 text-[13px] text-[var(--ink-faint)]"></div>
    </div>
  `);
  const cd = c.querySelector('#wait-cd');
  function draw(){
    const diff = CONFIG.RESULTS_TIME - now();
    if(diff <= 0){ render(); return; }
    cd.innerHTML = `Results unlock in <span class="text-[var(--gold-1)] font-semibold">${fmtClock(diff)}</span>`;
  }
  draw();
  tickHandle = setInterval(draw, 1000);
  return c;
}

/* ============================================================
   SCREEN: RESULTS / LEADERBOARD
   ============================================================ */
function screenResults(){
  const participated = !!state.submitted;
  const myScore = participated ? state.score : null;
  const total = QUESTIONS.length;
  const pct = participated ? Math.round((myScore/total)*100) : null;

  let board = MOCK_PARTICIPANTS.map(p=>({name:p.name, score:p.score, isMe:false}));
  if(participated){
    board.push({name: state.user.name + ' (You)', score: myScore, isMe:true});
  }
  board.sort((a,b)=> b.score - a.score);

  const rowsHtml = board.map((p, i)=>{
    const rank = i+1;
    let badgeStyle = 'background:rgba(255,255,255,0.06); color:var(--ink-dim);';
    if(rank===1) badgeStyle = 'background:linear-gradient(135deg,#F6C976,#D89A3F); color:#1A0F08;';
    else if(rank===2) badgeStyle = 'background:rgba(220,220,220,0.25); color:#F6EEDD;';
    else if(rank===3) badgeStyle = 'background:rgba(205,127,50,0.35); color:#F6EEDD;';
    return `
      <div class="flex items-center gap-3 py-3 px-3 rounded-xl ${p.isMe?'ring-1 ring-[var(--gold-1)]':''}" style="${p.isMe?'background:rgba(246,201,118,0.08);':''}">
        <div class="rank-badge" style="${badgeStyle}">${rank}</div>
        <div class="flex-1 text-sm ${p.isMe?'font-semibold text-[var(--ink)]':'text-[var(--ink-dim)]'}">${escapeHtml(p.name)}</div>
        <div class="text-sm font-semibold ${p.isMe?'gold-text':'text-[var(--ink-dim)]'}">${p.score}/${total}</div>
      </div>`;
  }).join('');

  const summaryHtml = participated ? `
    <div class="grid grid-cols-2 gap-3 mb-6">
      <div class="rounded-2xl p-4 text-center" style="background:rgba(255,255,255,0.03); border:1px solid rgba(246,201,118,0.12);">
        <div class="font-display text-3xl gold-text">${myScore}/${total}</div>
        <div class="text-[10px] uppercase tracking-widest text-[var(--ink-faint)] mt-1">Your Score</div>
      </div>
      <div class="rounded-2xl p-4 text-center" style="background:rgba(255,255,255,0.03); border:1px solid rgba(246,201,118,0.12);">
        <div class="font-display text-3xl gold-text">${pct}%</div>
        <div class="text-[10px] uppercase tracking-widest text-[var(--ink-faint)] mt-1">Percentage</div>
      </div>
    </div>
  ` : `
    <div class="rounded-2xl p-4 text-center mb-6" style="background:rgba(230,80,58,0.08); border:1px solid rgba(230,80,58,0.25);">
      <p class="text-sm text-[var(--ink-dim)]">You did not submit an entry for this quiz window.</p>
    </div>
  `;

  const c = card(`
    <h2 class="font-display text-xl md:text-2xl mb-1 text-center">Results &amp; Leaderboard</h2>
    <p class="text-sm text-[var(--ink-dim)] mb-6 text-center">Live standings — Book of Acts Online Bible Quiz</p>
    ${summaryHtml}
    <div class="space-y-1.5">${rowsHtml}</div>
  `);
  return c;
}

/* ============================================================
   UTIL
   ============================================================ */
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function showToast(msg, danger){
  const existing = document.getElementById('toast-el');
  if(existing) existing.remove();
  const t = document.createElement('div');
  t.id = 'toast-el';
  t.className = 'toast fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl glass text-sm font-medium max-w-[90vw] text-center';
  t.style.borderColor = danger ? 'rgba(230,80,58,0.5)' : 'rgba(246,201,118,0.3)';
  t.style.color = danger ? '#F6D9D2' : 'var(--ink)';
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>{ t.remove(); }, 3200);
}

/* ============================================================
   PROCTORING / SECURITY
   ============================================================ */
function isQuizActive(){
  return getPhase() === 'quiz';
}
function registerWarning(reason){
  if(!isQuizActive() || state.submitted) return;
  state.warnings = (state.warnings||0) + 1;
  saveState(state);
  if(state.warnings >= CONFIG.MAX_WARNINGS){
    state.flagged = true;
    showToast('Maximum warnings reached — quiz submitted automatically.', true);
    submitQuiz(true);
  } else {
    showToast(`Warning ${state.warnings}/${CONFIG.MAX_WARNINGS}: Tab switching or window minimizing is prohibited!`, true);
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) registerWarning('visibility');
});
window.addEventListener('blur', ()=> registerWarning('blur'));

document.addEventListener('contextmenu', e => { if(isQuizActive()||true) e.preventDefault(); });
document.addEventListener('selectstart', e => {
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'TEXTAREA' || tag === 'INPUT') return;
  e.preventDefault();
});
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('paste', e => e.preventDefault());
document.addEventListener('cut', e => e.preventDefault());
document.addEventListener('keydown', e => {
  const k = e.key ? e.key.toLowerCase() : '';
  const blockedCombo = (e.ctrlKey || e.metaKey) && ['c','v','u','x','s','p'].includes(k);
  const blockedShiftI = (e.ctrlKey || e.metaKey) && e.shiftKey && k === 'i';
  if(blockedCombo || blockedShiftI || k === 'f12'){
    e.preventDefault();
  }
});

/* ============================================================
   INIT
   ============================================================ */
render();
setInterval(()=>{
  // Periodic phase re-check to catch window boundaries even when no other timer is active
  const p = getPhase();
  if(app.dataset.phase !== p){
    app.dataset.phase = p;
    render();
  }
}, 5000);
</script>
